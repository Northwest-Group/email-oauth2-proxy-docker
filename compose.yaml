# Deployable stack (e.g. as a git-based stack in Dockhand). Override any ${VARIABLE} in the stack's environment.
services:
  emailproxy:
    image: ghcr.io/northwest-group/email-oauth2-proxy-docker:${IMAGE_TAG:-latest}
    container_name: emailproxy
    restart: unless-stopped
    environment:
      LOGFILE: ${LOGFILE:-true}
      DEBUG: ${DEBUG:-false}
      CACHE_STORE: ${CACHE_STORE:-/config/credstore.config}
      LOCAL_SERVER_AUTH: ${LOCAL_SERVER_AUTH:-true}
    volumes:
      # emailproxy.config, credstore.config and logs live here - keep this outside the repo
      - ${CONFIG_PATH:-/data/emailproxy/config}:/config
    ports:
      - ${SMTP_PORT:-25}:1587

services:
  emailproxy:
    image: ghcr.io/northwest-group/email-oauth2-proxy-docker:latest
    container_name: emailproxy
    restart: unless-stopped
    labels:
      # updates are handled by Dockhand, not Watchtower
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      LOGFILE: ${LOGFILE:-true}
      DEBUG: ${DEBUG:-false}
      CACHE_STORE: ${CACHE_STORE:-/config/credstore.config}
      LOCAL_SERVER_AUTH: ${LOCAL_SERVER_AUTH:-true}
    volumes:
      # emailproxy.config, credstore.config and logs live here - keep this outside the repo
      - /data/emailproxy/config:/config
    ports:
      - 25:1587
      # IMAP for the A/R portal runner on this host (MFA codes, invitations); loopback only
      - 127.0.0.1:1993:1993
    networks:
      - default
      # Traefik routes smtp.corp.tnwco.com to the proxy's port 80 for the Microsoft re-auth sign-in
      - traefik

networks:
  traefik:
    external: true
    name: traefik_default
